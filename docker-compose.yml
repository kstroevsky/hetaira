services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: prometheus
      POSTGRES_USER: prometheus
      POSTGRES_PASSWORD: prometheus
    ports:
      - "5432:5432"
    volumes:
      - prometheus-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-prometheus.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prometheus -d prometheus"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  prometheus-postgres:
