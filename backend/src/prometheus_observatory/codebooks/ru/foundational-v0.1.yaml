codebook_key: foundational-conversation-ru
version: 0.1.0
language: ru
validated: false
status: provisional
description: >-
  Базовая операционализация наблюдаемых диалоговых, пропозициональных,
  эпистемических и grounding-сигналов. Не измеряет влияние, власть или личность напрямую.
labels:
  dialogue_act:
    QUESTION:
      definition: Запрос информации или уточнения, для которого ожидается ответ.
      include: ["Прямой вопрос", "Просьба уточнить"]
      exclude: ["Риторический вопрос без ожидания ответа"]
      positive_examples: ["Почему мы переносим релиз?", "Что именно сломалось?"]
      hard_negatives: ["Почему бы и нет."]
    PROPOSE:
      definition: Предложение плана, варианта действия или решения.
      positive_examples: ["Давайте сначала починим стенд.", "Предлагаю отложить релиз."]
    AGREE:
      definition: Явное принятие или поддержка позиции либо предложения.
      positive_examples: ["Согласна, так надёжнее.", "Да, это верно."]
    DISAGREE:
      definition: Явное отрицание, возражение или контрпозиция.
      positive_examples: ["Не согласен: проблема в другом."]
    COMMIT:
      definition: Принятие говорящим обязательства выполнить действие.
      positive_examples: ["Я возьму стенд и отпишусь к вечеру."]
    ACKNOWLEDGE:
      definition: Сигнал получения или понимания вклада без обязательного согласия.
      positive_examples: ["Понял.", "Ок, вижу."]
    ASSERT:
      definition: Сообщение или утверждение, не покрытое более специфичным актом.
  epistemic_state:
    UNCERTAIN:
      definition: Говорящий снижает приверженность истинности пропозиции.
      positive_examples: ["Не уверен, что это поможет.", "Возможно, причина в кэше."]
      hard_negatives: ["Это точно кэш."]
    COMMITTED:
      definition: Говорящий выражает высокую приверженность истинности пропозиции.
  grounding:
    ACKNOWLEDGED:
      definition: Вклад явно получен или замечен.
    CLARIFICATION_REQUESTED:
      definition: Сигнал недостаточного понимания и запрос восстановления общего знания.
    REPAIRED:
      definition: Участник уточняет или исправляет ранее проблемное понимание.
  stance:
    SUPPORT:
      definition: Поддержка конкретной пропозиции, решения или сообщения-цели.
    OPPOSE:
      definition: Отрицание конкретной пропозиции, решения или сообщения-цели.
    SUSPEND:
      definition: Явное воздержание от принятия или отрицания цели.
required_evidence:
  - exact_span
abstention_rule: Если целевой объект или требуемый текстовый спан не определён, не создавать наблюдение.
