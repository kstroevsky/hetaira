[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prometheus-observatory"
version = "0.1.0"
description = "Evidence-first computational conversation observatory"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "alembic>=1.16,<2",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "httpx>=0.28,<1",
  "ijson>=3.4,<4",
  "jsonschema>=4.25,<5",
  "lxml>=6,<7",
  "igraph>=0.11,<1",
  "psycopg[binary]>=3.2.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
analytics = [
  "duckdb>=1.3,<2",
  "polars>=1.31,<2",
  "pyarrow>=20,<21",
  "igraph>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus_observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP046"]
